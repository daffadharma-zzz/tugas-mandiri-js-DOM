<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To do list</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <div class="toDo">
        <h1>TO DO LIST DW <img src="images/icon.png" /></h1>

        <div class="row">
          <input
            type="text"
            id="inputTask"
            placeholder="Tambahkan to do list"
          />
          <button id="tombol" type="button">tambah</button>
        </div>

        <p id="warningMessage" class="warning" hidden>
          Masukkan tugas terlebih dahulu.
        </p>

        <div class="action-row">
          <button id="selectAll" type="button">Centang Semua</button>
          <button id="deleteDone" type="button">Hapus yang dicentang</button>
        </div>

        <div class="stats" aria-label="statistik tugas">
          <div class="stat-box">
            <span>Total</span>
            <strong id="totalTasks">0</strong>
          </div>
          <div class="stat-box">
            <span>Selesai</span>
            <strong id="completedTasks">0</strong>
          </div>
          <div class="stat-box">
            <span>Belum Selesai</span>
            <strong id="remainingTasks">0</strong>
          </div>
        </div>

        <ul id="listContainer"></ul>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
